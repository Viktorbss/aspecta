# Checks on every pull request and every push to main: tests, lint, chart and manifest validation,
# image builds. Nothing is pushed anywhere.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            target: test # the test stage runs ruff and pytest inside the build
          - component: frontend
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/${{ matrix.component }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}

  manifests:
    name: Validate chart and GitOps manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      # schemas for CRDs such as Argo CD Applications
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install kubeconform
        run: |
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Lint chart
        run: |
          helm lint charts/aspecta
          helm lint charts/aspecta -f charts/aspecta/values-local.yaml
      - name: Validate rendered chart
        run: helm template aspecta charts/aspecta | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS"
      - name: Validate GitOps manifests
        run: kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" gitops/
