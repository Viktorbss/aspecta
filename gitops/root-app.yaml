# The only Application applied by hand (scripts/bootstrap.sh). It syncs gitops/apps/, which holds
# all other Applications and AppProjects ("app of apps"). Adding a file there deploys a new component.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Viktorbss/aspecta.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true # an Application removed from Git is removed from the cluster
      selfHeal: true # manual changes in the cluster are reverted to the state in Git
