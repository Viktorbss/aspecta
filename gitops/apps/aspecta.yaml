apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aspecta
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # after namespaces and platform add-ons
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aspecta
  source:
    repoURL: https://github.com/Viktorbss/aspecta.git
    targetRevision: main
    path: charts/aspecta
    helm:
      releaseName: aspecta
      valueFiles:
        - values.yaml
        # temporary: images loaded into kind with `kind load` until CI publishes them to GHCR
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aspecta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
