# SealedSecrets of the aspecta application, written by scripts/seal-backend-secret.sh.
# Kept apart from the chart: they are encrypted for one specific cluster, the chart is not.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aspecta-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the application, so pods start with the Secret present
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aspecta
  source:
    repoURL: https://github.com/Viktorbss/aspecta.git
    targetRevision: main
    path: gitops/secrets/aspecta
  destination:
    server: https://kubernetes.default.svc
    namespace: aspecta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
