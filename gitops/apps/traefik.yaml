apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3 # Traefik v3.7.16
    helm:
      valuesObject:
        service:
          type: NodePort # kind has no LoadBalancer; cluster/kind-config.yaml maps these NodePorts to 127.0.0.1
        ports:
          web:
            nodePort: 30080
          websecure:
            nodePort: 30443
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # the Traefik CRDs are too large for client-side apply
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
