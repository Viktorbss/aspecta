# Local cluster: 1 control plane + 2 workers, Calico instead of kind's default CNI.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aspecta
networking:
  # kindnet is replaced by Calico (installed by scripts/bootstrap.sh), which enforces NetworkPolicy
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16 # must match the IP pool in cluster/calico-values.yaml
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    # Traefik's NodePorts published on the host as http://localhost and https://localhost.
    # A NodePort instead of a hostPort, because Pod Security "baseline" forbids hostPorts.
    # Bound to 127.0.0.1, so the cluster is not reachable from the local network.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
