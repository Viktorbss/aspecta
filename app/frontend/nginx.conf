server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # probe target; deliberately does not depend on the backend
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # "backend" is the Kubernetes Service name (and the container name for local runs).
    # No upstream keepalive on purpose: every request opens a new connection, so kube-proxy
    # spreads the load across all backend pods, including pods just added by the HPA.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
