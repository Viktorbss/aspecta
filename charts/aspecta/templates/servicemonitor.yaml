{{- if .Values.monitoring.enabled }}
# tells Prometheus to scrape every pod behind the backend Service; the job label becomes "backend"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels:
    {{- include "aspecta.labels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "aspecta.selectorLabels" (dict "root" $ "component" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.scrapeInterval }}
{{- end }}
