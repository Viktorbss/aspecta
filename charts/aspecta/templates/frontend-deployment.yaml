{{- $c := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "aspecta.labels" (dict "root" $ "component" "frontend") | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "aspecta.selectorLabels" (dict "root" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aspecta.selectorLabels" (dict "root" $ "component" "frontend") | nindent 8 }}
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # spread replicas over the worker nodes, so losing one node never takes down all replicas
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule # a hard rule; ScheduleAnyway is only a preference
          nodeTaintsPolicy: Honor # ignore nodes the pods cannot run on (the tainted control plane)
          matchLabelKeys:
            - pod-template-hash # during a rollout, spread the new ReplicaSet on its own
          labelSelector:
            matchLabels:
              {{- include "aspecta.selectorLabels" (dict "root" $ "component" "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: "{{ $c.image.repository }}:{{ $c.image.tag }}"
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $c.port }}
          # /healthz is answered by nginx itself, so a backend outage does not restart the frontend
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # nginx keeps its pid and temp files here; the root filesystem is read-only
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
