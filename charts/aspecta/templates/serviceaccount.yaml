{{- range $name := list "frontend" "backend" }}
---
# a dedicated identity without any API permissions; no token is mounted into the pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "aspecta.labels" (dict "root" $ "component" $name) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
