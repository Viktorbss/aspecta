{{- range $name := list "frontend" "backend" }}
{{- $c := index $.Values $name }}
{{- if $c.autoscaling.enabled }}
---
# the HPA owns the replica count, which is why the Deployment omits spec.replicas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "aspecta.labels" (dict "root" $ "component" $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    {{- toYaml $.Values.autoscalingBehavior | nindent 4 }}
{{- end }}
{{- end }}
